# mise のグローバル設定(全マシン共通)。プロジェクト側の .tool-versions /
# mise.toml があればそちらが勝つ。
#
# 2026-08-15 に ~/.tool-versions から移行した。移行前は nodejs 22.11.0 が
# 書かれたまま放置されていて、**プロジェクトの外で pnpm を叩くと 22.11.0 に
# 落ちて「pnpm が壊れた」ように見える**(pnpm 11 は Node 22.13 以上を要求する)
# という形で実害が出ていた。両方に書くと必ずまたずれるので、ここ一箇所にする。
#
# --- 2026-08-28: 版を固定するのをやめた ------------------------------------
#
# 移行時は全部 exact に書いた。**13日後に10本中6本が古くなっていた**
# (node 24.18.0→26.8.1 / pnpm 11.15.0→11.24.0 / yazi 26.5.6→26.8.15 /
#  uv 0.12.4→0.12.6 / fd 10.4.2→10.5.0 / fzf 0.74.2→0.74.3)。
# 手で追う前提の運用は、追わなくなった時点で「意図した固定」ではなく
# 「放置された古い版」になる —— 22.11.0 で踏んだのと同じ形。
#
# **そして、下の CLI 群を exact にする理由はもともと無かった。** ここに置く
# 理由として書いてあるのは全部「apt のが古すぎる」「apt に無い」で、
# **要求は下限であって同一ではない**。同じ版を両 OS に配ることを約束すると、
# 守るのは手作業になり、破れても誰も気づかない。
#
# `latest` は「毎回最新を追う」ではない(実測): mise は**入っている中の最新**を
# 使い、無いときだけ最新を入れる。既存マシンで勝手に動かず、新規マシンだけが
# 現在の最新を取る。**更新は `mise up` で明示的に**やる。
#
# node だけ `lts`。`latest` は Current(2026-08 時点で 26.x)を取るが、個人環境の
# 既定は LTS であるべきで、仕事でもデプロイ先でも LTS しか選べない。
# **2026-10-28 に Node 26 が LTS 化すると、ここは自動で 26 系に動く。**
# それで困るプロジェクトは自分の .tool-versions を持つこと(持っていれば勝つ)。

[tools]
node = "lts"
python = "latest"
uv = "latest"
pnpm = "latest"

# OS を跨いで欲しい CLI。**brew と apt の両方に書かないための逃がし先**が
# ここ(README の3層の話)。yazi は Ubuntu の apt に無く、zoxide も古い。
yazi = "latest"
zoxide = "latest"
# grep / find / cat の置き換え。**どれも .gitignore を尊重する**ので、
# リポジトリの中で node_modules に結果を埋められない。
ripgrep = "latest"
fd = "latest"
bat = "latest"
# fzf も brew/apt ではなくここ。**Ubuntu 24.04 の apt は 0.44.1** で、
# `--zsh` を持たない古さのために .zshrc に専用の分岐が生えていた。
fzf = "latest"

# ここに足したツールは macOS でも Ubuntu/WSL でも入る。
# **OS 別のパッケージリスト(~/.Brewfile と bootstrap の apt 節)を
# 二重に保守しないための逃がし先**がここ。
# 例: mise use -g ripgrep@latest
